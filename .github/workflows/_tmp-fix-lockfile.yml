name: "[temp] Fix lockfile"

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Refresh yarn.lock (non-immutable)
        id: install
        run: |
          set +e
          yarn install 2>&1 | tee /tmp/install-output.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: "[diagnostic] Poster l'erreur dans une issue"
        if: failure() && steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 55000 /tmp/install-output.log > /tmp/install-output-tail.txt || true
          node -e "
            const fs = require('fs');
            const body = '## [diagnostic temporaire] Sortie de yarn install\n\n\`\`\`\n' + fs.readFileSync('/tmp/install-output-tail.txt', 'utf8') + '\n\`\`\`';
            fs.writeFileSync('/tmp/issue-body.json', JSON.stringify({ title: '[diagnostic temporaire] yarn install échoue', body }));
          "
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d @/tmp/issue-body.json \
            "https://api.github.com/repos/${{ github.repository }}/issues"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock déjà à jour, rien à committer."
          else
            git add yarn.lock
            git commit -m "chore: resynchronise yarn.lock avec les package.json de la release"
            git push origin HEAD:main
          fi
