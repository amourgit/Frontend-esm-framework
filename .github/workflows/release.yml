name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-node avec cache: 'yarn' invoque `yarn` pour resoudre le
      # dossier de cache AVANT que le packageManager du repo (yarn@4.10.3) ne
      # soit actif. Sans ceci, c'est le Yarn Classic 1.x pre-installe sur
      # l'image ubuntu-latest qui repond, incompatible avec ce depot -> la
      # detection de cache echoue et le job s'arrete des cette etape, avant
      # meme l'installation des dependances.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @changesets/cli@3.0.1 déclare "engines.node": "^22.11 || ^24 ||
          # >=26" et son bin.js appelle process.getBuiltinModule('node:module')
          # .enableCompileCache() sans filet - sur Node 20.x cette fonction
          # n'existe pas dans ce module, l'étape de publication plante avec
          # "enableCompileCache is not a function" avant même de lire les
          # changesets. Node 20.x cassait aussi silencieusement @carbon/themes
          # (warning EBADENGINE dans verify-pack-install.mjs, engines >=22).
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: publint
        run: npm run verify:publint

      - name: arethetypeswrong
        run: npm run verify:attw

      # Verrou bloquant : aucune publication ne doit avoir lieu si un package
      # a une dépendance interne non déclarée ou un pointeur main/exports
      # cassé. Voir scripts/verify-pack-install.mjs pour le détail du test.
      - name: Pack + install isolé + smoke-import
        run: node scripts/verify-pack-install.mjs

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: sh -c "yarn ci:publish 2>&1 | tee /tmp/publish-output.log"
          version: yarn release
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "[diagnostic temporaire] Poster l'erreur de publication dans une issue"
        if: failure() && steps.changesets.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 55000 /tmp/publish-output.log > /tmp/publish-output-tail.txt 2>/dev/null || echo "(pas de log capture)" > /tmp/publish-output-tail.txt
          node -e "
            const fs = require('fs');
            const body = '## [diagnostic temporaire] Sortie de yarn ci:publish\n\n\`\`\`\n' + fs.readFileSync('/tmp/publish-output-tail.txt', 'utf8') + '\n\`\`\`';
            fs.writeFileSync('/tmp/issue-body.json', JSON.stringify({ title: '[diagnostic temporaire] publication npm echoue', body }));
          "
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d @/tmp/issue-body.json \
            "https://api.github.com/repos/${{ github.repository }}/issues"
