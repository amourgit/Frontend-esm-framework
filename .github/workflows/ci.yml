name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-node avec cache: 'yarn' invoque `yarn` pour resoudre le
      # dossier de cache AVANT que le packageManager du repo (yarn@4.10.3) ne
      # soit actif. Sans ceci, c'est le Yarn Classic 1.x pre-installe sur
      # l'image ubuntu-latest qui repond, incompatible avec ce depot -> la
      # detection de cache echoue et le job s'arrete des cette etape, avant
      # meme l'installation des dependances.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: |
          set -o pipefail
          yarn test 2>&1 | tee /tmp/ci-tests.log

      # Mesure de diagnostic TEMPORAIRE, meme raison et meme mecanisme que
      # celui deja utilise (puis retire) sur release.yml : logs de job
      # inaccessibles depuis le sandbox utilise pour deboguer ce depot.
      - name: Publie le log de diagnostic si les tests ont echoue
        if: steps.run_tests.outcome == 'failure'
        run: |
          mkdir -p /tmp/ci-debug-worktree-3
          cp /tmp/ci-tests.log /tmp/ci-debug-worktree-3/last-test-failure.log
          cd /tmp/ci-debug-worktree-3
          git init -q
          git config user.name "ci-debug-bot"
          git config user.email "actions@github.com"
          git add last-test-failure.log
          git commit -q -m "ci-debug: log yarn test (run ${{ github.run_id }}, tentative ${{ github.run_attempt }})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-debug-3

      - name: Bloque le job si les tests ont échoué
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

      - name: TypeScript check
        run: yarn workspaces foreach --all run typescript --if-present

  verify-publish:
    name: Vérification pré-publication (publint + pack/install isolé)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-node avec cache: 'yarn' invoque `yarn` pour resoudre le
      # dossier de cache AVANT que le packageManager du repo (yarn@4.10.3) ne
      # soit actif. Sans ceci, c'est le Yarn Classic 1.x pre-installe sur
      # l'image ubuntu-latest qui repond, incompatible avec ce depot -> la
      # detection de cache echoue et le job s'arrete des cette etape, avant
      # meme l'installation des dependances.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      # Verifie la forme reelle de chaque tarball publiable (exports, main,
      # types, files) contre ce que `npm pack` publierait vraiment.
      - name: publint
        run: npm run verify:publint

      # Verifie que les types de chaque package se resolvent correctement
      # selon le mode de resolution du consommateur (node10, node16
      # CJS/ESM, bundler). Necessite que les dependances internes soient
      # reellement publiees sur le registre pour donner un signal fiable
      # (c'est le cas depuis la publication complete des 34 packages).
      - name: arethetypeswrong
        run: npm run verify:attw

      # Le test decisif : pack chaque package publiable, l'installe dans un
      # projet neuf totalement isole du monorepo (aucun hoisting Yarn), puis
      # importe reellement chacun d'eux. C'est ce test precis qui aurait
      # detecte les dependances internes non declarees avant toute
      # publication, plutot que de les decouvrir chez un consommateur externe.
      - name: Pack + install isolé + smoke-import
        run: node scripts/verify-pack-install.mjs
