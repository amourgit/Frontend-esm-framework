name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-node avec cache: 'yarn' invoque `yarn` pour resoudre le
      # dossier de cache AVANT que le packageManager du repo (yarn@4.10.3) ne
      # soit actif. Sans ceci, c'est le Yarn Classic 1.x pre-installe sur
      # l'image ubuntu-latest qui repond, incompatible avec ce depot -> la
      # detection de cache echoue et le job s'arrete des cette etape, avant
      # meme l'installation des dependances.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: TypeScript check
        # Chaque workspace déclare `typescript` (H7) : plus besoin d'exposer un `tsc` global.
        run: yarn workspaces foreach --all run typescript

      # Garde-fou de l'automatisation « le shell est republié dès qu'un paquet qu'il embarque change ».
      - name: Tests des scripts de release
        run: node --test scripts/ensure-shell-rebuild.test.mjs

  e2e-natif:
    name: Cibles de build et E2E natif simulé (H2, H6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: Cibles de build web/android/ios et règles B1 (H6)
        # Construit les 3 cibles, contrôle les artefacts (CSP, pont egenTarget, aucun script distant/inline) et vérifie
        # que les violations des règles natives font échouer le build. Laisse les artefacts web et android pour l'e2e.
        run: yarn verify:targets

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: E2E (Host simulé)
        run: yarn e2e

  verify-publish:
    name: Vérification pré-publication (publint + pack/install isolé)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-node avec cache: 'yarn' invoque `yarn` pour resoudre le
      # dossier de cache AVANT que le packageManager du repo (yarn@4.10.3) ne
      # soit actif. Sans ceci, c'est le Yarn Classic 1.x pre-installe sur
      # l'image ubuntu-latest qui repond, incompatible avec ce depot -> la
      # detection de cache echoue et le job s'arrete des cette etape, avant
      # meme l'installation des dependances.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      # Verifie la forme reelle de chaque tarball publiable (exports, main,
      # types, files) contre ce que `npm pack` publierait vraiment.
      - name: publint
        run: npm run verify:publint

      # Verifie que les types de chaque package se resolvent correctement
      # selon le mode de resolution du consommateur (node10, node16
      # CJS/ESM, bundler). Necessite que les dependances internes soient
      # reellement publiees sur le registre pour donner un signal fiable
      # (c'est le cas depuis la publication complete des 34 packages).
      - name: arethetypeswrong
        run: npm run verify:attw

      # Le test decisif : pack chaque package publiable, l'installe dans un
      # projet neuf totalement isole du monorepo (aucun hoisting Yarn), puis
      # importe reellement chacun d'eux. C'est ce test precis qui aurait
      # detecte les dependances internes non declarees avant toute
      # publication, plutot que de les decouvrir chez un consommateur externe.
      - name: Pack + install isolé + smoke-import
        run: node scripts/verify-pack-install.mjs
