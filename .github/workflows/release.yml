name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-node avec cache: 'yarn' invoque `yarn` pour resoudre le
      # dossier de cache AVANT que le packageManager du repo (yarn@4.10.3) ne
      # soit actif. Sans ceci, c'est le Yarn Classic 1.x pre-installe sur
      # l'image ubuntu-latest qui repond, incompatible avec ce depot -> la
      # detection de cache echoue et le job s'arrete des cette etape, avant
      # meme l'installation des dependances.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: publint
        run: npm run verify:publint

      - name: arethetypeswrong
        run: npm run verify:attw

      # Verrou bloquant : aucune publication ne doit avoir lieu si un package
      # a une dépendance interne non déclarée ou un pointeur main/exports
      # cassé. Voir scripts/verify-pack-install.mjs pour le détail du test.
      #
      # Mesure de diagnostic TEMPORAIRE : le contenu de cette étape n'est
      # accessible ni via `gh run view --log` (hôte de stockage hors
      # allowlist réseau du sandbox utilisé pour déboguer ce dépôt), ni via
      # l'API Checks (permissions insuffisantes du token utilisé). En cas
      # d'échec, le log est donc publié comme une issue GitHub (API Issues,
      # sans rapport avec les éventuelles protections de branche sur main -
      # une première tentative committant directement sur main a échoué,
      # cause probable). A retirer une fois ce point de blocage résolu.
      - name: Pack + install isolé + smoke-import
        id: pack_install
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/verify-pack-install.mjs 2>&1 | tee /tmp/pack-install.log

      - name: Publie le log de diagnostic si l'étape précédente a échoué
        if: steps.pack_install.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/pack-install.log', 'utf8').slice(-60000);
            const fence = '```';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ci-debug: echec verify-pack-install (run ${context.runId}, tentative ${process.env.GITHUB_RUN_ATTEMPT})`,
              body: `${fence}\n${log}\n${fence}`,
            });

      - name: Bloque le job si le pack/install a échoué
        if: steps.pack_install.outcome == 'failure'
        run: exit 1

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: yarn ci:publish
          version: yarn release
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
