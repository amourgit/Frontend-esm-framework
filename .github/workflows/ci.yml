name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-node avec cache: 'yarn' invoque `yarn` pour resoudre le
      # dossier de cache AVANT que le packageManager du repo (yarn@4.10.3) ne
      # soit actif. Sans ceci, c'est le Yarn Classic 1.x pre-installe sur
      # l'image ubuntu-latest qui repond, incompatible avec ce depot -> la
      # detection de cache echoue et le job s'arrete des cette etape, avant
      # meme l'installation des dependances.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: Run tests
        run: |
          set -o pipefail
          yarn test 2>&1 | tee /tmp/test-output.log

      # DIAGNOSTIC TEMPORAIRE (à retirer une fois la vraie cause identifiée) :
      # poste la fin des logs de test dans un commentaire de la PR, car les
      # logs bruts d'Actions ne sont accessibles qu'via le stockage blob
      # d'Azure, injoignable depuis l'environnement d'analyse utilisé ici.
      - name: "[diagnostic temporaire] Poster les logs d'échec sur la PR"
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 55000 /tmp/test-output.log > /tmp/test-output-tail.txt || true
          node -e "
            const fs = require('fs');
            const body = '## [diagnostic temporaire] Sortie de yarn test (fin du log)\n\n\`\`\`\n' + fs.readFileSync('/tmp/test-output-tail.txt', 'utf8') + '\n\`\`\`';
            fs.writeFileSync('/tmp/comment-body.json', JSON.stringify({ body }));
          "
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d @/tmp/comment-body.json \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"

      - name: TypeScript check
        run: yarn workspaces foreach --all run typescript --if-present

  verify-publish:
    name: Vérification pré-publication (publint + pack/install isolé)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-node avec cache: 'yarn' invoque `yarn` pour resoudre le
      # dossier de cache AVANT que le packageManager du repo (yarn@4.10.3) ne
      # soit actif. Sans ceci, c'est le Yarn Classic 1.x pre-installe sur
      # l'image ubuntu-latest qui repond, incompatible avec ce depot -> la
      # detection de cache echoue et le job s'arrete des cette etape, avant
      # meme l'installation des dependances.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      # Verifie la forme reelle de chaque tarball publiable (exports, main,
      # types, files) contre ce que `npm pack` publierait vraiment.
      - name: publint
        run: npm run verify:publint

      # Verifie que les types de chaque package se resolvent correctement
      # selon le mode de resolution du consommateur (node10, node16
      # CJS/ESM, bundler). Necessite que les dependances internes soient
      # reellement publiees sur le registre pour donner un signal fiable
      # (c'est le cas depuis la publication complete des 34 packages).
      - name: arethetypeswrong
        run: npm run verify:attw

      # Le test decisif : pack chaque package publiable, l'installe dans un
      # projet neuf totalement isole du monorepo (aucun hoisting Yarn), puis
      # importe reellement chacun d'eux. C'est ce test precis qui aurait
      # detecte les dependances internes non declarees avant toute
      # publication, plutot que de les decouvrir chez un consommateur externe.
      - name: Pack + install isolé + smoke-import
        run: node scripts/verify-pack-install.mjs
