name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: TypeScript check
        run: yarn workspaces foreach --all run typescript --if-present

  verify-publish:
    name: Vérification pré-publication (publint + pack/install isolé)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      # Verifie la forme reelle de chaque tarball publiable (exports, main,
      # types, files) contre ce que `npm pack` publierait vraiment.
      - name: publint
        run: npm run verify:publint

      # Verifie que les types de chaque package se resolvent correctement
      # selon le mode de resolution du consommateur (node10, node16
      # CJS/ESM, bundler). Necessite que les dependances internes soient
      # reellement publiees sur le registre pour donner un signal fiable
      # (c'est le cas depuis la publication complete des 34 packages).
      - name: arethetypeswrong
        run: npm run verify:attw

      # Le test decisif : pack chaque package publiable, l'installe dans un
      # projet neuf totalement isole du monorepo (aucun hoisting Yarn), puis
      # importe reellement chacun d'eux. C'est ce test precis qui aurait
      # detecte les dependances internes non declarees avant toute
      # publication, plutot que de les decouvrir chez un consommateur externe.
      - name: Pack + install isolé + smoke-import
        run: node scripts/verify-pack-install.mjs
