name: Publish Next (canary)

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  publish-next:
    name: Publish @next
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Voir release.yml : sans ceci, le Yarn Classic pre-installe sur le
      # runner repond a la detection de cache de setup-node a la place de
      # Yarn Berry 4.10.3, et le job echoue avant l'installation.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Publish canary packages
        run: yarn ci:publish-next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
