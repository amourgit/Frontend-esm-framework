name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      # Verrou bloquant : aucune publication ne doit avoir lieu si un package
      # a une dépendance interne non déclarée ou un pointeur main/exports
      # cassé. Voir scripts/verify-pack-install.mjs pour le détail du test.
      - name: publint
        run: node scripts/verify-publint.mjs

      - name: Pack + install isolé + smoke-import
        run: node scripts/verify-pack-install.mjs

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: yarn ci:publish
          version: yarn release
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
