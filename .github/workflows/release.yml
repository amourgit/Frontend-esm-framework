name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-node avec cache: 'yarn' invoque `yarn` pour resoudre le
      # dossier de cache AVANT que le packageManager du repo (yarn@4.10.3) ne
      # soit actif. Sans ceci, c'est le Yarn Classic 1.x pre-installe sur
      # l'image ubuntu-latest qui repond, incompatible avec ce depot -> la
      # detection de cache echoue et le job s'arrete des cette etape, avant
      # meme l'installation des dependances.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @changesets/cli@3.0.1 déclare "engines.node": "^22.11 || ^24 ||
          # >=26" et son bin.js appelle process.getBuiltinModule('node:module')
          # .enableCompileCache() sans filet - sur Node 20.x cette fonction
          # n'existe pas dans ce module, l'étape de publication plante avec
          # "enableCompileCache is not a function" avant même de lire les
          # changesets. Node 20.x cassait aussi silencieusement @carbon/themes
          # (warning EBADENGINE dans verify-pack-install.mjs, engines >=22).
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: publint
        run: npm run verify:publint

      - name: arethetypeswrong
        run: npm run verify:attw

      # Verrou bloquant : aucune publication ne doit avoir lieu si un package
      # a une dépendance interne non déclarée ou un pointeur main/exports
      # cassé. Voir scripts/verify-pack-install.mjs pour le détail du test.
      - name: Pack + install isolé + smoke-import
        run: node scripts/verify-pack-install.mjs

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: yarn ci:publish
          version: yarn release
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
